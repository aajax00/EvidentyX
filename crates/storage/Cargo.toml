[package]
name = "evidentyx-storage"
description = "Persistance SQLite d'EVIDENTYX (schéma versionné, enquêtes)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
evidentyx-core = { path = "../core" }
# SQLite compilé avec le crate (« bundled ») : aucune bibliothèque système
# requise, même version de SQLite sur Linux, Windows et macOS.
rusqlite = { version = "0.43", features = ["bundled"] }
# Attributs d'événement (colonne JSON), même dépendance que evidentyx-parser.
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
