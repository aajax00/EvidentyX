[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/CHANGER-MOI/evidentyx"
authors = ["Contributeurs EVIDENTYX"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
