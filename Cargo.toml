[workspace]
resolver = "2"
members = ["crates/core", "crates/evidence", "crates/parser", "crates/storage", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/aajax00/EvidentyX"
authors = ["Contributeurs EVIDENTYX"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimisé, mais compilé en parallèle : codegen-units = 1 réduisait un peu la
# taille du binaire au prix de plusieurs minutes de compilation par plateforme.
[profile.release]
lto = "thin"

# En développement aussi, SQLite et les calculs lourds sont optimisés :
# non optimisés, ils sont plusieurs fois plus lents et faussent les essais.
[profile.dev.package]
libsqlite3-sys = { opt-level = 3 }
sha2 = { opt-level = 3 }
csv-core = { opt-level = 3 }
serde_json = { opt-level = 3 }
