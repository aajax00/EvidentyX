[package]
name = "evidentyx-desktop"
description = "Hôte de bureau Tauri 2 d'EVIDENTYX."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "evidentyx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
evidentyx-core = { path = "../../../crates/core" }
evidentyx-storage = { path = "../../../crates/storage" }
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
tempfile = "3"
