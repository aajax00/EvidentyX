name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux : un seul job pour le formatage, Clippy et tous les tests, afin de
  # n'installer les paquets système et de ne compiler les dépendances qu'une fois.
  linux:
    name: Linux (qualité et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Sans dépendance système : échoue vite si le code n'est pas formaté.
      - name: Vérifier le formatage
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système Tauri
        # Les paquets .deb sont mis en cache GitHub : seul le premier run (ou un
        # changement de liste) les télécharge depuis le miroir apt, parfois très
        # lent. Les runs suivants les restaurent en quelques secondes.
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        timeout-minutes: 20
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
          version: tauri-1
          execute_install_scripts: true
      # Paquets restaurés depuis le cache : rafraîchit le cache de l'éditeur de
      # liens dynamique pour que les tests trouvent les bibliothèques WebKitGTK.
      - name: Rafraîchir les bibliothèques partagées
        run: sudo ldconfig
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Construire l'interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tests de l'interface
        working-directory: apps/desktop
        run: npm test
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Windows et macOS : pas de paquets système à installer pour Tauri.
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Construire l'interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tests
        run: cargo test --workspace
