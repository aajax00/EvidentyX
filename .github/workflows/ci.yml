name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux : un seul job pour le formatage, Clippy et tous les tests, afin de
  # n'installer les paquets système et de ne compiler les dépendances qu'une fois.
  linux:
    name: Linux (qualité et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Sans dépendance système : échoue vite si le code n'est pas formaté.
      - name: Vérifier le formatage
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système Tauri
        # Le miroir apt peut se bloquer : délai borné et nouvelles tentatives.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Construire l'interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tests de l'interface
        working-directory: apps/desktop
        run: npm test
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Windows et macOS : pas de paquets système à installer pour Tauri.
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Construire l'interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - name: Tests
        run: cargo test --workspace
